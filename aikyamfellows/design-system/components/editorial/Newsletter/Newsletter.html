<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter — aikyam fellows</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin: 0; padding: 2rem 0; }
  .ds-note { font-family: var(--af-font-ui); font-size: var(--af-type-small);
             color: var(--af-text-quiet); margin: 0 0 1.5rem; }
</style>
<main id="main" class="wrap">
  <p class="ds-note">The signup. Not a commerce CTA — nothing is scarce and nothing happens if the reader says no.</p>
  <section data-newsletter>
    <h2>Stories, when there are stories</h2>
    <p>We publish a few times a month.</p>
    <form data-newsletter-form>
      <label for="nl">Your email address</label>
      <input id="nl" type="email" autocomplete="email">
      <button data-button type="submit">Subscribe</button>
    </form>
    <p data-newsletter-privacy>We use it to send you the stories and nothing else.</p>
  </section>
</main>
