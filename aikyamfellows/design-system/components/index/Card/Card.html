<!-- @dsCard group="Index" -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card — aikyam fellows</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin: 0; padding: 2rem 0; }
  .ds-note { font-family: var(--af-font-ui); font-size: var(--af-type-small);
             color: var(--af-text-quiet); margin: 0 0 1.5rem; }
</style>
<main id="main" class="wrap wrap--wide">
  <p class="ds-note">One entry in an index. The person\u2019s name leads, the story title follows, the face is on the right.</p>
  <ul data-cards>
    <li data-card>
      <div data-card-inner>
        <div data-card-text>
          <a data-card-name href="/x/">Jasentha Joy</a>
          <h3 data-card-title><a href="/x/">Pickles and Chuckles</a></h3>
          <p data-card-meta>Livelihood · 5 May 2026</p>
        </div>
        <div data-card-face aria-hidden="true"></div>
      </div>
    </li>
    <li data-card>
      <div data-card-inner>
        <div data-card-text>
          <h3 data-card-title><a href="/y/">Ramya Sundararajan</a></h3>
          <p data-card-meta>Aftercare · 3 December 2025</p>
        </div>
        <div data-card-face aria-hidden="true"></div>
      </div>
    </li>
  </ul>
</main>
