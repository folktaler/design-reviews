<!-- @dsCard group="Forms" -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field — aikyam fellows</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin: 0; padding: 2rem 0; }
  .ds-note { font-family: var(--af-font-ui); font-size: var(--af-type-small);
             color: var(--af-text-quiet); margin: 0 0 1.5rem; }
</style>
<main id="main" class="wrap">
  <p class="ds-note">One input with its label and hint. The label is ABOVE the input and is never a placeholder.</p>
  <div data-field>
    <label for="e">Your email address</label>
    <p data-field-hint id="eh">We only use this to reply to you.</p>
    <input id="e" type="email" autocomplete="email" aria-describedby="eh">
  </div>
  <div data-field>
    <label for="m">Your message <span data-field-optional>(optional)</span></label>
    <textarea id="m"></textarea>
  </div>
</main>
